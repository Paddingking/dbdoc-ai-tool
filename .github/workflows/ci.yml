name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (Maven + Tests + Security Scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build & Test (with JaCoCo coverage gate)
        working-directory: backend
        run: mvn -B -ntp verify

      - name: Dependency vulnerability scan (OWASP)
        working-directory: backend
        run: mvn -B -ntp dependency-check:check
        continue-on-error: true   # 扫描报告供审阅，不硬阻断首次接入

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: backend/target/site/jacoco

  frontend:
    name: Frontend (Type check + Unit tests + Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Compile Electron main + build renderer
        working-directory: frontend
        run: npm run build:electron && npm run build

  package:
    name: Package Desktop Installer (release tags only)
    needs: [ backend, frontend ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend jar
        working-directory: backend
        run: mvn -B -ntp -DskipTests package

      - name: Package installer
        working-directory: frontend
        run: npm install && npm run dist:electron
        env:
          # 代码签名相关 secrets（仓库 Settings → Secrets 配置）
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbdoc-ai-installer
          path: frontend/dist-electron/*.exe
